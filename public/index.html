<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#20232a" media="(prefers-color-scheme: dark)">
  <!-- Too much for this phone? The lite version (worker/lib/lite-mode.mjs):
       the same link's card with no map and no app script. Asked once, here,
       before anything heavy loads: a phone that cannot draw the map (no
       WebGL), says it has 2GB or less (Chrome on Android; Safari never says),
       or has Data Saver on. The answer is the agora_lite cookie, and a choice
       made by hand (?lite=0 or ?lite=1) is never asked again. Not for a
       crawler, which reads the full page. Reloads only
       when the cookie took, so a phone that refuses cookies is not looped. -->
  <script>
    (function () {
      try {
        if (/(?:^|;\s*)agora_lite=/.test(document.cookie)) return;
        if (/bot|crawl|spider|preview/i.test(navigator.userAgent)) return;
        var n = navigator, c = document.createElement('canvas'), gl = null;
        try { gl = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) {}
        if (gl && gl.getExtension('WEBGL_lose_context')) gl.getExtension('WEBGL_lose_context').loseContext();
        var weak = !gl || (n.deviceMemory && n.deviceMemory <= 2) || (n.connection && n.connection.saveData);
        if (!weak) return;
        document.cookie = 'agora_lite=1; path=/; max-age=31536000; samesite=lax; secure';
        if (/(?:^|;\s*)agora_lite=1/.test(document.cookie)) location.replace(location.href);
      } catch (e) {}
    })();
  </script>
  <!-- What this link is, for a reader that runs no JavaScript: a chat app's
       preview, a search engine. The Worker writes each link's own between
       the marks (worker/lib/page-head.mjs): a parish's name and Church data,
       a collection's heading and card. What is here is what a link gets when
       it could not: the home page's words, kept out of the index. -->
  <!--page:head-->
  <title>Orthodox Services &amp; Events — orthodoxy.au</title>
  <meta name="description" content="Service times and events at Orthodox parishes across Australia and New Zealand — Greek, Antiochian, Serbian, Russian, Romanian and Macedonian — on one map.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:site_name" content="orthodoxy.au">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orthodox Services &amp; Events">
  <meta property="og:description" content="Service times and events at Orthodox parishes across Australia and New Zealand — Greek, Antiochian, Serbian, Russian, Romanian and Macedonian — on one map.">
  <meta property="og:image" content="https://orthodoxy.au/og/default.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!--/page:head-->
  <!-- Saved to a Home Screen, the page is an app (docs/architecture.md): its
       icon, its name under the icon, and sw.js, which opens it with the last
       feed it saw when there is no signal. Registered after load, so nothing
       the first paint needs waits on it. On a visit sw.js did not answer (the
       first), it is told what the page loaded without it, to keep too. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="orthodoxy.au">
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        var unanswered = !navigator.serviceWorker.controller;
        navigator.serviceWorker.register('/sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function (reg) {
            if (!unanswered || !reg.active) return;
            reg.active.postMessage({ keep: performance.getEntriesByType('resource').map(function (e) { return e.name; }) });
          })
          .catch(function () {});
      });
    }
  </script>
  <!-- v3: a page around a map rather than a map under a sheet. It reads
       /api/bundle through bundle.js and the /shared/ projection, and somebody
       signed in edits through the /api/admin routes /admin uses. -->
  <link rel="stylesheet" href="/lib/maplibre-gl.css">
  <link rel="stylesheet" href="/shared/event-editor.css">
  <link rel="stylesheet" href="/next/next.css">
</head>
<body>
  <!-- Search and the account, and at the left, faint, who is signed in or
       what the site is (next.js, syncAccount): where the map is looking is
       said under it, in the parish chip. -->
  <header class="top">
    <p class="top-who" id="top-who">Eastern Orthodox events &amp; parishes</p>
    <div class="top-actions">
      <button class="round-btn" type="button" data-search aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
      <!-- The account: a way in when nobody is signed in, the panel and the
           way out when somebody is (next.js, checkSignIn). -->
      <button class="round-btn" type="button" id="btn-account" data-account aria-haspopup="menu" aria-expanded="false" aria-label="Sign in" title="Sign in">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="10" r="3.3"/><path d="M6.2 18.6a7 7 0 0 1 11.6 0"/></svg>
        <span class="account-dot" aria-hidden="true" hidden></span>
      </button>
    </div>
  </header>

  <!-- Scrolled past the parish chip and the filters, they come with you,
       in a header of their own (next.js, the dock): the chip, the filters,
       search and the account, and the filters' chips under them. The panel
       opened from here opens under it. -->
  <div class="dock" id="dock" inert>
    <div class="dock-head">
      <div class="dock-row">
        <button class="dock-chip" type="button" data-inview aria-label="Parishes in view"></button>
        <button class="fpill fbtn" type="button" data-filters aria-expanded="false" aria-controls="filter-panel">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span>Filters</span><span class="fcount" hidden></span>
        </button>
        <button class="round-btn sm" type="button" data-search aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
        <button class="round-btn sm" type="button" data-account aria-haspopup="menu" aria-expanded="false" aria-label="Sign in" title="Sign in">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="10" r="3.3"/><path d="M6.2 18.6a7 7 0 0 1 11.6 0"/></svg>
          <span class="account-dot" aria-hidden="true" hidden></span>
        </button>
      </div>
      <div class="dock-active" id="dock-active"></div>
    </div>
  </div>

  <main id="page">
    <!-- NextThere's viewport: a map inside the page, nothing on it but full
         screen. The tabs above it and the parish row under it are next.js's,
         and the map is map.js itself. -->
    <section class="viewport-card" id="viewport-card">
      <nav class="jurisdiction-banner" id="juris-row" aria-label="Jurisdictions"></nav>
      <div class="viewport" id="viewport">
        <div id="map"></div>
        <!-- The app's gum-tree loader, over the map alone while it loads: the
             rest of the page is there to read meanwhile. It goes once the map
             has drawn with its parishes on it (lsHide, in next.js). -->
        <div id="loading-screen" aria-hidden="true">
          <div class="ls-tree-wrap"></div>
          <div class="ls-log" id="ls-log"></div>
        </div>
        <script src="/shared/loading-screen.js"></script>
        <button class="map-fs" type="button" id="btn-fullscreen" aria-label="Full screen" title="Full screen">
          <svg class="fs-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <svg class="fs-close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
        </button>
        <!-- Where you are, in the map's corner. -->
        <button class="map-locate" type="button" id="btn-locate" aria-label="Near me" title="Near me">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.7 2.3a1 1 0 0 0-1.06-.23l-18 7a1 1 0 0 0 .08 1.89l7.6 2.17 2.17 7.6a1 1 0 0 0 .93.73h.03a1 1 0 0 0 .93-.64l7-18a1 1 0 0 0-.22-1.06z"/></svg>
        </button>
      </div>
      <!-- What the viewport holds, said in words under the small map: a count,
           where the map is looking, and up to seven logos; one parish by its
           name. Panning changes it. -->
      <button class="inview" type="button" id="inview" aria-label="Parishes in view"></button>
      <!-- Full screen, the app's parish row at the foot of the map instead:
           the count, then every parish as its logo, in view first. -->
      <div class="parish-row" id="parish-row">
        <button class="parish-fav-fab" id="btn-favourites" type="button" hidden aria-label="Favourite parishes" title="Favourite parishes">
          <svg viewBox="0 0 256 256" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="m234.29 114.85l-45 38.83L203 211.75a16.4 16.4 0 0 1-24.5 17.82L128 198.49l-50.53 31.08A16.4 16.4 0 0 1 53 211.75l13.76-58.07l-45-38.83A16.46 16.46 0 0 1 31.08 86l59-4.76l22.76-55.08a16.36 16.36 0 0 1 30.27 0l22.75 55.08l59 4.76a16.46 16.46 0 0 1 9.37 28.86Z"/></svg>
        </button>
        <button class="parish-counter" type="button" data-inview aria-label="Parishes in view">
          <svg viewBox="0 0 256 256" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M228.12 145.14L192 123.47V104a8 8 0 0 0-4-7l-52-29.64V48h16a8 8 0 0 0 0-16h-16V16a8 8 0 0 0-16 0v16h-16a8 8 0 0 0 0 16h16v19.36L68 97.05a8 8 0 0 0-4 7v19.47l-36.12 21.62A8 8 0 0 0 24 152v64a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-48a8 8 0 0 1 16 0v48a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-64a8 8 0 0 0-3.88-6.86M40 156.53l24-14.4V208H40ZM128 144a24 24 0 0 0-24 24v40H80v-99.36l48-27.43l48 27.43V208h-24v-40a24 24 0 0 0-24-24m88 64h-24v-65.87l24 14.4Z"/></svg>
          <span id="inview-n">0</span>
        </button>
        <div class="parish-pills" id="parish-pills"></div>
      </div>
    </section>

    <!-- The filters: a button beside the chips they make, opening the app's
         pills under it. -->
    <div class="filter-bar">
      <button class="fpill fbtn" type="button" id="btn-filters" data-filters aria-expanded="false" aria-controls="filter-panel">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Filters</span><span class="fcount" id="filter-count" hidden></span>
      </button>
      <div class="active-filters" id="active-filters"></div>
    </div>
    <div class="filter-panel" id="filter-panel" role="group" aria-label="Filters" hidden></div>

    <!-- This view's link, building as the filters change, as the app's does:
         tap to copy. -->
    <div class="page-link">
      <button class="url-chip" type="button" id="page-link" data-copy="/" aria-label="Copy this view's link"><span class="url-text"></span><svg class="url-copy" viewBox="0 0 256 256" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg></button>
    </div>

    <!-- Wide, the page under the map is two columns (next.css, the wide
         layout): Today and your own lists at the left, everything else at
         the right. Narrower, these two are nothing, and it all runs on. -->
    <div class="col-side">
    <!-- Today, before anything else. -->
    <section class="today card" id="today" aria-label="Today"></section>

    <!-- Favourites, open on the page: each starred parish and what is next
         there. Then the other lists, bookmarks and saved views, small. -->
    <section class="favs" id="favs"></section>
    <section class="shelf" id="shelf-lists"></section>

    </div>
    <div class="col-main">
    <!-- Curated: the slices of the data, as collections of parishes. -->
    <section class="shelf" id="shelf-collections"></section>

    <!-- What's on: the one-offs, poster first. -->
    <section class="shelf" id="shelf-whatson"></section>

    <!-- Languages and jurisdictions: links in a row, not more shelves. -->
    <section class="shelf" id="shelf-languages"></section>
    <section class="shelf" id="shelf-jurisdictions"></section>

    </div>
  </main>

  <!-- The way to the lite version by hand (worker/lib/lite-mode.mjs). -->
  <p class="lite-switch"><a href="?lite=1" rel="nofollow">Lite version</a> for slow phones</p>

  <!-- The foot of the page, small and faint (Kevin, 27 Oct 2026): who keeps
       it fresh and the way to join them, the suggest form as a permanent
       editor (next.js, becomeEditor); who made it, and the parish to visit;
       then the year and the disclaimer, a card of its own (openDisclaimer).
       A rule above and below sets the credits apart from the lite version
       and the disclaimer. -->
  <footer class="foot">
    <div class="foot-rule" aria-hidden="true"><span></span></div>
    <p>Kept fresh by volunteers. <button class="foot-link" type="button" data-become-editor>Become an editor</button></p>
    <p>Made with <svg class="foot-heart" viewBox="0 0 24 24" width="11" height="11" role="img" aria-label="love"><path fill="currentColor" d="M12 21s-8.5-5.2-8.5-11.4A4.9 4.9 0 0 1 12 6.6a4.9 4.9 0 0 1 8.5 3C20.5 15.8 12 21 12 21z"/></svg> by Kevin Paul &amp; Friends<br>
      Come visit us at <a class="foot-link" href="/smg" data-go>Sts. Michael &amp; Gabriel, Ryde</a></p>
    <div class="foot-rule" aria-hidden="true"><span></span></div>
    <p class="foot-end">2026 · <button class="foot-link" type="button" data-disclaimer>Disclaimer</button></p>
  </footer>

  <!-- Sheets: a collection, a parish, an event, lists. A link that opens one
       has it painted here by the Worker (worker/lib/page-card.mjs), until
       next.js opens its own in its place. -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-host" id="sheets"><!--page:card--></div>

  <script src="/shared/jurisdiction-colors.js"></script>
  <script src="/shared/declutter.js"></script>
  <script src="/shared/event-types.js"></script>
  <!-- The app's link grammar and the readers it rests on, in the app's order. -->
  <script src="/shared/locations.js"></script>
  <script src="/shared/services.js"></script>
  <script src="/shared/timetable.js"></script>
  <script src="/shared/timetable-lines.js"></script>
  <script src="/shared/dates.js"></script>
  <script src="/shared/languages.js"></script>
  <script src="/shared/slugs.js"></script>
  <script src="/shared/url-state.js"></script>
  <script src="/shared/link-words.js"></script>
  <script src="/shared/search-words.js"></script>
  <script src="/shared/collections.js"></script>
  <script src="/shared/saved.js"></script>
  <!-- The links in an event's description, as links. -->
  <script src="/shared/linkify.js"></script>
  <!-- Where things came from, and "Suggest an edit" before the sign-in. -->
  <script src="/shared/source-line.js"></script>
  <!-- A form as a card of its own: the suggest form, and every editor (next/editing.js). -->
  <script src="/shared/form-sheet.js"></script>
  <script src="/shared/suggest-dialog.js"></script>
  <!-- Not here: the editor (next/editing.js, the add-event editor and what it
       rests on). A visitor never uses it and it was ~100 KB every visitor
       waited on before the map could start; next.js loads it for somebody
       who may edit, and before any editing control does anything
       (next.js, EDITING_SCRIPTS). -->
  <script src="/lib/maplibre-gl.js"></script>
  <script src="/lib/pmtiles.js"></script>
  <script src="/lib/protomaps-themes-base.js"></script>
  <script src="/map.js"></script>
  <script src="/bundle.js"></script>
  <script src="/next/next.js"></script>
</body>
</html>
