<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
  <!-- What this link is, for a reader that runs no JavaScript: a chat app's
       preview, a search engine. The Worker writes each link's own between
       the marks (worker/lib/page-head.mjs): a parish's name and Church data,
       a collection's heading and card. What is here is what a link gets when
       it could not: the home page's words, kept out of the index. -->
  <!--page:head-->
  <title>Orthodox Services &amp; Events — orthodoxy.au</title>
  <meta name="description" content="Service times and events at Orthodox parishes across Australia and New Zealand — Greek, Antiochian, Serbian, Russian, Romanian and Macedonian — on one map.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:site_name" content="orthodoxy.au">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orthodox Services &amp; Events">
  <meta property="og:description" content="Service times and events at Orthodox parishes across Australia and New Zealand — Greek, Antiochian, Serbian, Russian, Romanian and Macedonian — on one map.">
  <meta property="og:image" content="https://orthodoxy.au/og/default.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!--/page:head-->
  <!-- v3: a page around a map rather than a map under a sheet. It reads
       /api/bundle through bundle.js and the /shared/ projection, and somebody
       signed in edits through the /api/admin routes /admin uses. -->
  <link rel="stylesheet" href="/lib/maplibre-gl.css">
  <link rel="stylesheet" href="/shared/event-editor.css">
  <link rel="stylesheet" href="/next/next.css">
</head>
<body>
  <header class="top">
    <button class="place" type="button" id="place" aria-label="Use my location">
      <span class="place-name" id="place-name">Australia</span>
      <span class="place-sub" id="place-sub">orthodoxy.au</span>
    </button>
    <div class="top-actions">
      <!-- The account: a way in when nobody is signed in, the panel and the
           way out when somebody is (next.js, checkSignIn). -->
      <button class="round-btn" type="button" id="btn-account" aria-label="Sign in" title="Sign in">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="10" r="3.3"/><path d="M6.2 18.6a7 7 0 0 1 11.6 0"/></svg>
        <span class="account-dot" id="account-dot" aria-hidden="true" hidden></span>
      </button>
      <button class="round-btn" type="button" id="btn-locate" aria-label="Near me" title="Near me">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21.7 2.3a1 1 0 0 0-1.06-.23l-18 7a1 1 0 0 0 .08 1.89l7.6 2.17 2.17 7.6a1 1 0 0 0 .93.73h.03a1 1 0 0 0 .93-.64l7-18a1 1 0 0 0-.22-1.06z"/></svg>
      </button>
    </div>
  </header>

  <main id="page">
    <!-- Search: a field you can see, opening a sheet that answers as you type. -->
    <button class="search-pill" type="button" id="search-pill">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <span>Parishes, suburbs, services…</span>
    </button>

    <!-- NextThere's viewport: a map inside the page, nothing on it but full
         screen. The tabs above it and the parish row under it are the app's
         own (filters.js, renderParishPills), and the map is map.js itself. -->
    <section class="viewport-card" id="viewport-card">
      <nav class="jurisdiction-banner" id="juris-row" aria-label="Jurisdictions"></nav>
      <div class="viewport" id="viewport">
        <div id="map"></div>
        <!-- The app's gum-tree loader, over the map alone while it loads: the
             rest of the page is there to read meanwhile. It goes once the map
             has drawn with its parishes on it (lsHide, in next.js). -->
        <div id="loading-screen" aria-hidden="true">
          <div class="ls-tree-wrap"></div>
          <div class="ls-log" id="ls-log"></div>
        </div>
        <script src="/shared/loading-screen.js"></script>
        <button class="map-fs" type="button" id="btn-fullscreen" aria-label="Full screen" title="Full screen">
          <svg class="fs-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <svg class="fs-close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></svg>
        </button>
      </div>
      <!-- What the viewport holds, said in words under the small map: a count
           and up to seven logos. Panning changes it. -->
      <button class="inview" type="button" id="inview" aria-label="Parishes in view"></button>
      <!-- Full screen, the app's parish row at the foot of the map instead:
           the count, then every parish as its logo, in view first. -->
      <div class="parish-row" id="parish-row">
        <button class="parish-fav-fab" id="btn-favourites" type="button" hidden aria-label="Favourite parishes" title="Favourite parishes">
          <svg viewBox="0 0 256 256" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="m234.29 114.85l-45 38.83L203 211.75a16.4 16.4 0 0 1-24.5 17.82L128 198.49l-50.53 31.08A16.4 16.4 0 0 1 53 211.75l13.76-58.07l-45-38.83A16.46 16.46 0 0 1 31.08 86l59-4.76l22.76-55.08a16.36 16.36 0 0 1 30.27 0l22.75 55.08l59 4.76a16.46 16.46 0 0 1 9.37 28.86Z"/></svg>
        </button>
        <button class="parish-counter" type="button" data-inview aria-label="Parishes in view">
          <svg viewBox="0 0 256 256" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M228.12 145.14L192 123.47V104a8 8 0 0 0-4-7l-52-29.64V48h16a8 8 0 0 0 0-16h-16V16a8 8 0 0 0-16 0v16h-16a8 8 0 0 0 0 16h16v19.36L68 97.05a8 8 0 0 0-4 7v19.47l-36.12 21.62A8 8 0 0 0 24 152v64a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-48a8 8 0 0 1 16 0v48a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-64a8 8 0 0 0-3.88-6.86M40 156.53l24-14.4V208H40ZM128 144a24 24 0 0 0-24 24v40H80v-99.36l48-27.43l48 27.43V208h-24v-40a24 24 0 0 0-24-24m88 64h-24v-65.87l24 14.4Z"/></svg>
          <span id="inview-n">0</span>
        </button>
        <div class="parish-pills" id="parish-pills"></div>
      </div>
    </section>

    <!-- The filters: a button beside the chips they make, opening the app's
         pills under it. -->
    <div class="filter-bar">
      <button class="fpill fbtn" type="button" id="btn-filters" aria-expanded="false" aria-controls="filter-panel">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Filters</span><span class="fcount" id="filter-count" hidden></span>
      </button>
      <div class="active-filters" id="active-filters"></div>
    </div>
    <div class="filter-panel" id="filter-panel" role="group" aria-label="Filters" hidden></div>

    <!-- This view's link, building as the filters change, as the app's does:
         tap to copy. -->
    <div class="page-link">
      <button class="url-chip" type="button" id="page-link" data-copy="/" aria-label="Copy this view's link"><span class="url-text"></span><svg class="url-copy" viewBox="0 0 256 256" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></svg></button>
    </div>

    <!-- Today, before anything else. -->
    <section class="today card" id="today" aria-label="Today"></section>

    <!-- Curated: the slices of the data, as collections of parishes. -->
    <section class="shelf" id="shelf-lists"></section>
    <section class="shelf" id="shelf-collections"></section>

    <!-- App Store's feed: what's on, poster first. -->
    <section class="shelf" id="shelf-whatson"></section>

    <section class="shelf" id="shelf-languages"></section>
    <section class="shelf" id="shelf-jurisdictions"></section>

    <!-- And always waiting underneath, like reviews at the bottom of a place:
         every service and event, day after day, for as long as you scroll. -->
    <section class="stream" id="stream" aria-label="Every service and event">
      <header class="stream-head">
        <h2>Every service &amp; event</h2>
        <p id="stream-sub">In view, day by day. Keep scrolling.</p>
        <!-- From today, or from a date picked: /2026-10-25. -->
        <div id="stream-when"></div>
      </header>
      <div id="stream-days"></div>
      <div class="stream-more" id="stream-more">Loading…</div>
    </section>
  </main>

  <!-- Sheets: a collection, a parish, an event, lists. A link that opens one
       has it painted here by the Worker (worker/lib/page-card.mjs), until
       next.js opens its own in its place. -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-host" id="sheets"><!--page:card--></div>

  <script src="/shared/jurisdiction-colors.js"></script>
  <script src="/shared/declutter.js"></script>
  <script src="/shared/event-types.js"></script>
  <!-- The app's link grammar and the readers it rests on, in the app's order. -->
  <script src="/shared/locations.js"></script>
  <script src="/shared/services.js"></script>
  <script src="/shared/timetable.js"></script>
  <script src="/shared/timetable-lines.js"></script>
  <script src="/shared/dates.js"></script>
  <script src="/shared/slugs.js"></script>
  <script src="/shared/url-state.js"></script>
  <script src="/shared/collections.js"></script>
  <!-- Where things came from, and "Suggest an edit" before the sign-in. -->
  <script src="/shared/source-line.js"></script>
  <script src="/shared/suggest-dialog.js"></script>
  <!-- For somebody who may edit (next/editing.js): the app's add-event
       editor and what it rests on, in /admin's order, a rule's form, and a
       parish's details (the short link it suggests). -->
  <script src="/shared/read-from.js"></script>
  <script src="/shared/acronym-suggest.js"></script>
  <script src="/shared/logo-image.js"></script>
  <script src="/shared/kind-picker.js"></script>
  <script src="/shared/event-checks.js"></script>
  <script src="/shared/sse.js"></script>
  <script src="/shared/signs.js"></script>
  <script src="/shared/venue-picker.js"></script>
  <script src="/shared/event-editor.js"></script>
  <script src="/shared/time-field.js"></script>
  <script src="/shared/rule-form.js"></script>
  <script src="/lib/maplibre-gl.js"></script>
  <script src="/lib/pmtiles.js"></script>
  <script src="/lib/protomaps-themes-base.js"></script>
  <script src="/map.js"></script>
  <script src="/bundle.js"></script>
  <script src="/next/editing.js"></script>
  <script src="/next/next.js"></script>
</body>
</html>
