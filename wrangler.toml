name = "agora"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Serve only from the routes attached in the dashboard (orthodoxy.au/* and
# *.orthodoxy.au/*), never from agora.<subdomain>.workers.dev.
#
# Cloudflare Access binds to a hostname. With workers.dev live, an Access policy
# on orthodoxy.au leaves a second, unprotected way to reach the same Worker —
# /admin.html would load there for anyone. The admin API still refuses (it
# verifies the Access JWT's signature and audience itself, on every hostname),
# so this closes a door rather than a hole. Preview URLs are on the same
# subdomain and go with it.
workers_dev = false
preview_urls = false

# The D1 binding. `env.DB` inside the Worker.
[[d1_databases]]
binding = "DB"
database_name = "agora"
database_id = "8e02890d-dc75-4dbe-a018-b64c7871dde9"

# Replaces node-cron. One trigger, four-hourly, for the Google Calendar adapter.
# node-cron ran an in-process timer in a long-lived server; a Cron Trigger
# invokes the Worker's scheduled() handler instead.
[triggers]
crons = ["0 */4 * * *"]

[observability]
enabled = true

# Binary assets: map tiles, parish logos, event posters. These were files on the
# VM's disk (/opt/agora/tiles read-only, /opt/agora/data/{logos,posters}
# written by the admin panel). R2 charges no egress, which matters because the
# PMTiles archive is the heaviest thing the site serves.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "agora-assets"


# Static frontend served by the Worker itself.
#
# The plan said Pages + a Worker on the same domain. Workers static assets does
# the same job in one deployment: same origin (so every relative fetch in
# app.js keeps working, and there is no CORS surface at all), SPA fallback
# built in (replacing the _redirects file), and assets served free without
# invoking the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Which paths reach the Worker before the asset router.
#
# Without this the asset router answers first, and in SPA mode any request it
# cannot match a file for gets index.html. That is right for client routes like
# /smg or /102:2026-09-06, and wrong for the Worker's own paths: a browser tab
# opened on /health was served the app, whose detectUrlState() then read
# "health" as a parish slug. `fetch()` calls were unaffected, which is why the
# feed worked while the same URL typed into the address bar did not.
run_worker_first = [
  "/health", "/api/*",
  "/tiles/*", "/logos/*", "/posters/*",
  # The pay-link redirects (/<acronym>/donate|raffle|payment|gala) are only
  # ever reached by someone clicking a shared link — a navigation, and so
  # exactly the request the asset router would swallow. A slug with no link
  # on file still falls through to the SPA from inside the Worker.
  "/*/donate", "/*/raffle", "/*/payment", "/*/gala",
]

# Cloudflare Access, for /api/admin/*. Declared here rather than added in the
# dashboard, because `wrangler deploy` treats this file as the complete set of
# bindings: anything added through the dashboard and not written down here is
# removed by the next deploy. Adding these by hand worked until a merge
# redeployed the Worker and silently took them away again, twice.
#
# No secret is committed. A store id and a secret name are identifiers — the
# same class of thing as database_id above — and the values live in the account
# Secrets Store. These arrive in `env` as objects, not strings; readSecret() in
# worker/lib/auth.mjs awaits .get() on them.
#
# To rotate: change the value in the Secrets Store. Nothing here changes.

[[secrets_store_secrets]]
binding = "ACCESS_TEAM_DOMAIN"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "ACCESS_TEAM_DOMAIN"

[[secrets_store_secrets]]
binding = "ACCESS_AUD"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "ACCESS_AUD"

[[secrets_store_secrets]]
binding = "GOOGLE_API_KEY"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "GOOGLE_API_KEY"

