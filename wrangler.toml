name = "agora"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Serve only from the routes attached in the dashboard (orthodoxy.au/* and
# *.orthodoxy.au/*), never from agora.<subdomain>.workers.dev.
#
# Cloudflare Access binds to a hostname. With workers.dev live, an Access policy
# on orthodoxy.au leaves a second, unprotected way to reach the same Worker —
# /admin.html would load there for anyone. The admin API still refuses (it
# verifies the Access JWT's signature and audience itself, on every hostname),
# so this closes a door rather than a hole. Preview URLs are on the same
# subdomain and go with it.
workers_dev = false
preview_urls = false

# The D1 binding. `env.DB` inside the Worker.
[[d1_databases]]
binding = "DB"
database_name = "agora"
database_id = "8e02890d-dc75-4dbe-a018-b64c7871dde9"

# Replaces node-cron. node-cron ran an in-process timer in a long-lived server;
# a Cron Trigger invokes the Worker's scheduled() handler instead.
#
# HOURLY, and that is a heartbeat rather than a schedule. A Cron Trigger is
# fixed at deploy time — the Worker cannot change its own — so pacing lives in
# the adapter_settings table instead, where the admin panel can reach it. Each
# tick asks which adapters are due and usually answers "none", which costs one
# invocation and no requests to anybody's calendar.
#
# This is the ceiling on resolution: an adapter can be paced slower than hourly
# but never faster. Nothing wants faster.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# Binary assets: map tiles, parish logos, event posters. These were files on the
# VM's disk (/opt/agora/tiles read-only, /opt/agora/data/{logos,posters}
# written by the admin panel). R2 charges no egress, which matters because the
# PMTiles archive is the heaviest thing the site serves.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "agora-assets"


# Static frontend served by the Worker itself.
#
# The plan said Pages + a Worker on the same domain. Workers static assets does
# the same job in one deployment: same origin (so every relative fetch in
# app.js keeps working, and there is no CORS surface at all), SPA fallback
# built in (replacing the _redirects file), and assets served free without
# invoking the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Which paths reach the Worker before the asset router.
#
# EVERY PAGE PATH, and no static file. The Worker answers a shared parish or
# event link with a lite card of its own (worker/routes/pages.mjs) — /sgr,
# /sgr/next-tue, /102, /42:2026-10-04 — and the parish and event share buttons
# produce exactly the single-segment paths the asset router used to answer with
# the app before the Worker ever saw them. Everything the Worker does not
# answer, it hands back with env.ASSETS.fetch(), so the app still loads for
# /greek, /services, / and every other client route.
#
# `*` matches across `/` and the NEGATIVE rules are tested first (miniflare's
# asset router; production's is the same code). That makes the negations
# load-bearing in one direction only: they must name directories and TEXT
# extensions, and NEVER an image extension — `!/*.png` would send
# /posters/x.png straight to the asset router, which has no posters, instead of
# the Worker's R2 proxy. A static file missing from the list costs one Worker
# invocation and nothing else, because the fallback serves it anyway.
#
# The payment links (/<acronym>/donate) and the API ride on "/*" too; listing
# them separately is refused as redundant.
run_worker_first = [
  "/*",
  "!/shared/*", "!/lib/*", "!/glyphs/*", "!/sprites/*", "!/eucalyptus/*",
  "!/og/*", "!/assets/*", "!/static/*", "!/cdn-cgi/*",
  "!/*.js", "!/*.mjs", "!/*.css", "!/*.json", "!/*.html", "!/*.svg",
  "!/*.txt", "!/*.map", "!/*.ico", "!/*.webmanifest",
]

# Cloudflare Access, for /api/admin/*. Declared here rather than added in the
# dashboard, because `wrangler deploy` treats this file as the complete set of
# bindings: anything added through the dashboard and not written down here is
# removed by the next deploy. Adding these by hand worked until a merge
# redeployed the Worker and silently took them away again, twice.
#
# No secret is committed. A store id and a secret name are identifiers — the
# same class of thing as database_id above — and the values live in the account
# Secrets Store. These arrive in `env` as objects, not strings; readSecret() in
# worker/lib/auth.mjs awaits .get() on them.
#
# To rotate: change the value in the Secrets Store. Nothing here changes.

[[secrets_store_secrets]]
binding = "ACCESS_TEAM_DOMAIN"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "ACCESS_TEAM_DOMAIN"

[[secrets_store_secrets]]
binding = "ACCESS_AUD"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "ACCESS_AUD"

[[secrets_store_secrets]]
binding = "GOOGLE_API_KEY"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "GOOGLE_API_KEY"

# Lets /admin start the "Extract parish PDFs" workflow itself, instead of
# handing somebody a link to GitHub and hoping they have an account.
#
# A fine-grained GitHub personal access token scoped to THIS REPOSITORY ONLY,
# with Actions: read and write and nothing else — it cannot read code, write
# contents, or reach another repo. Not a Cloudflare credential: this is the
# Worker calling GitHub, the opposite direction to the R2 keys the extraction
# workflow uses, which are GitHub Actions secrets and belong over there.
#
# Declared here rather than left in the dashboard for the reason at the top of
# this section: Workers Builds deploys on every push to main, and a binding
# that is not written down is a binding the next deploy removes.
[[secrets_store_secrets]]
binding = "GITHUB_ACTIONS_TOKEN"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "GITHUB_ACTIONS_TOKEN"

# Lets the add-event editor read a dropped poster with Claude (Haiku 4.5) —
# worker/lib/poster-read.mjs. An Anthropic API key; set a monthly spend limit on
# it in the Anthropic Console, since nothing here counts what it costs.
#
# OPTIONAL in the code, like the GitHub token. Without it a dropped poster is
# still stored and attached, and the editor says reading is not set up and
# leaves the fields to be typed — the same editor, minus the reading.
#
# ANTHROPIC_BASE_URL is deliberately not declared: it exists so `wrangler dev`
# can be pointed at a local stand-in (docs/browser-checks.md) with --var.
[[secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "caf2bffa59d544e88e6649b71c3e6c09"
secret_name = "ANTHROPIC_API_KEY"


# Which repository holds the "Extract parish PDFs" workflow.
#
# A plain var, not a secret: an owner/repo pair is an identifier, and the panel
# builds a public link out of it. The TOKEN that lets /admin start a run is a
# secret and is deliberately NOT declared here — see below.
[vars]
GITHUB_REPO = "kvnpt/agora"

# GITHUB_ACTIONS_TOKEN is declared above, and remains OPTIONAL in the code.
#
# A deployment without it is not broken: the panel still reads the workflow's
# run history, and "Re-fetch from the parish" hands over a link to GitHub
# instead of starting the run itself. That degradation is deliberate and is
# tested, so removing the binding is a supported thing to do rather than a way
# to break /admin.
