name: CI

# Machine gate on every PR into main and on direct pushes to main.
#
# The old gate booted server.js and curled /health — a reasonable check when the
# app was a long-lived Express process. There is no process to boot now, so the
# equivalent checks are: the test suite passes, the Worker actually builds, and
# the D1 schema applies cleanly to an empty database.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean, lockfile-exact install. Fails on a drifted package-lock.json.
      - name: Install (npm ci)
        run: npm ci

      # The suite covers the date lens, the timezone fast path against the
      # Temporal polyfill, override semantics, feed dedup, adapter bookkeeping,
      # HTTP range parsing, and that the D1 seed is safe to run twice.
      - name: Test
        run: npm test

      # The load-bearing check: if the Worker cannot be bundled, nothing else
      # matters. Also proves every binding in wrangler.toml resolves.
      - name: Build the Worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/agora-build

      # d1/seed.test.mjs applies the schema too, but only to assert things about
      # the seed. This checks the schema on its own terms: that it lands on an
      # empty database with foreign keys on and nothing for the integrity
      # checker to complain about.
      - name: Apply the D1 schema to a scratch database
        run: |
          node -e "
            const Database = require('better-sqlite3');
            const fs = require('fs');
            const db = new Database('/tmp/ci-schema.db');
            db.pragma('foreign_keys = ON');
            db.exec(fs.readFileSync('d1/schema.sql', 'utf8'));
            db.exec(fs.readFileSync('d1/seed-parishes.sql', 'utf8'));
            const fk = db.pragma('foreign_key_check');
            const ic = db.pragma('integrity_check');
            if (fk.length) { console.error('foreign_key_check:', fk); process.exit(1); }
            if (ic[0].integrity_check !== 'ok') { console.error('integrity_check:', ic); process.exit(1); }
            const n = db.prepare(\"SELECT COUNT(*) n FROM parishes WHERE id != '_unassigned'\").get().n;
            const s = db.prepare('SELECT COUNT(*) n FROM schedules').get().n;
            if (!n || !s) { console.error('seed produced nothing:', { parishes: n, schedules: s }); process.exit(1); }
            console.log('schema + seed ok:', n, 'parishes,', s, 'rules');
          "

      # The D1 seed is generated from seeds/parishes.js. If someone edits one
      # without regenerating the other they diverge silently, so check here.
      - name: Generated seed is up to date
        run: |
          node scripts/gen-seed-sql.js
          node scripts/sql-for-console.js
          git diff --exit-code d1/ || {
            echo "::error::d1/ is stale — run 'npm run gen:seed' and commit the result"
            exit 1
          }
